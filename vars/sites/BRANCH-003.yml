---
# vars/sites/BRANCH-003.yml
# -----------------------------------------------------------------------
# Site-level vars. Regional defaults are inherited from vars/regions/AMER.yml.
# Any key defined here overrides the regional default.
# -----------------------------------------------------------------------

# ── Branch identity ───────────────────────────────────────────────────
site_name: "BRANCH-003"
region: "AMER"            # links to vars/regions/AMER.yml
org_name: "NVIDIA-IT"

# ── Physical location ─────────────────────────────────────────────────
location:
  address:
    street: "7916 Aqua Vista Dr"
    city: "Plano"
    state: "TX"
    postal_code: "75025"
    country: "USA"
  coordinates:            # optional — omit if unknown
    latitude: 18.5204
    longitude: 73.8567

# ── Site-level shared config ──────────────────────────────────────────
bgp:
  local_as: "100"         # shared by all CPEs at this branch

# ── Regional overrides (optional) ────────────────────────────────────
# Uncomment to override defaults from vars/regions/AMER.yml
device_group: "SPOKE-AMER-REGION-1-DG"
template_name: "SPOKE-AMER-REGION-1"

# ── Service templates ─────────────────────────────────────────────────
# Lists the service templates associated with CPEs at this site.
# Each entry must have a `name` matching a Director service template and
# an optional `org` (defaults to org_name).
# Create vars/service_templates/<name>.yml to map $v_ vars to Ansible vars.
service_templates:
  - name: "NV_MGMT"
    org: "NVIDIA-IT"

# ── Devices ───────────────────────────────────────────────────────────
devices:
  - device_name: "BRANCH-003-PRIMARY"
    serial_number: "107-1"
    deployment_type: "physical"
    model_number: "Versa CSG1500"
    license_period: 1
    # device_group / template_name: omit to inherit from site or region
    # ── Template-specific vars ──────────────────────────────────────
    inet1_static_address: "192.168.20.23/24"
    inet1_transport_vr_hop: "192.168.20.10"
    inet2_static_address: "192.168.30.23/24"
    inet2_transport_vr_hop: "192.168.30.10"
    lan_corp_ipv4_address: "192.168.18.1/24"
    lan_corp_bgp_neighbor_ip: "192.168.10.100"
    lan_corp_bgp_peer_as:     "103"
    vni_0-1_unit: "30"
    vni_0-1_vlan: "30"
    vni_0-2_unit: "20"
    vni_0-2_vlan: "20"
    # ── Service template vars (NV_MGMT) ────────────────────────────
    svc_vz_mgmt_director_addr_1: "10.78.22.21/32"
    svc_vz_mgmt_director_addr_2: "10.78.22.22/32"
    svc_vz_mgmt_director_addr_3: "10.78.22.23/32"
    svc_vz_mgmt_director_addr_4: "10.78.22.24/32"
    system_user_password: "Versa@1234"
    mgmt_lo_addr: "100.1.2.15/32"
