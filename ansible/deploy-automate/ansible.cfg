[defaults]
# Overall Ansible run log — captures all task output
# Path is relative to where ansible-playbook is invoked (sdwan-automate/)
log_path = logs/ansible.log

# Suppress SSH host-key prompts (we are running against localhost)
host_key_checking = False

# Hide skipped tasks from console output (they are still recorded in logs/ansible.log)
display_skipped_hosts = False
